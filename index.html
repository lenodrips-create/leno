<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>edudeck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2f6bb0;
    --accent:#4ea1ff;
    --text:#ffffff;
    color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    min-height:100%;
    background:linear-gradient(160deg,#4b5361,#3a414d);
    color:var(--text);
    font-family:"Open Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:0 20px;
  }
  .wrap{width:100%;max-width:760px;margin:0 auto;padding:64px 0 40px;text-align:center;}
  .logo{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:52px;}
  .logo .mark{width:54px;height:54px;border-radius:13px;
    background:linear-gradient(150deg,#4ea1ff,#2f6bb0);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:28px;
    box-shadow:0 4px 14px rgba(0,0,0,.25);}
  .logo .name{font-size:40px;font-weight:700;letter-spacing:-.02em;}
  .logo .name b{color:#7fbcff;font-weight:700;}
  form{display:flex;flex-direction:column;gap:20px;}
  .field{display:none;}
  .field.show{display:block;}
  .field input{width:100%;padding:16px 18px;border-radius:8px;border:none;font:inherit;font-size:17px;color:#1b2027;}
  button{width:100%;padding:20px;border-radius:8px;font:inherit;font-size:20px;font-weight:600;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;transition:filter .15s ease;}
  button:hover{filter:brightness(1.08);}
  .b-primary{background:var(--blue);color:#fff;border:none;}
  .b-white{background:#fff;color:#2f6bb0;border:none;}
  .b-outline{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.55);}
  .foot{margin-top:60px;display:flex;flex-direction:column;gap:24px;}
  .foot a{color:#dfe4ea;text-decoration:underline;font-size:16px;cursor:pointer;}
  .icon{font-size:20px;line-height:1;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <div class="mark">E</div>
      <div class="name">edu<b>deck</b></div>
    </div>

    <form id="gate">
      <button type="button" class="b-primary" onclick="go()">
        <span class="icon">📚</span> enter edudeck
      </button>
      <button type="button" class="b-white" onclick="ask()">
        <span class="icon">🧑‍🎓</span> sign in with a name
      </button>
      <button type="button" class="b-outline" onclick="go()">
        <span class="icon">▦</span> continue as guest
      </button>

      <div class="field" id="namefield">
        <input id="name" placeholder="type any name" autocomplete="off"
               onkeydown="if(event.key==='Enter'){event.preventDefault();go();}">
      </div>
    </form>

    <div class="foot">
      <a onclick="go()">new here? just jump in.</a>
      <a onclick="go()">need help getting started?</a>
    </div>
  </div>

  <script>
    function ask(){
      var f=document.getElementById('namefield');
      f.classList.add('show');
      document.getElementById('name').focus();
    }
    function go(){
      // any name is accepted and ignored; nothing is stored or sent
      window.location.href = "home.html";
    }
  </script>
</body>
</html>
