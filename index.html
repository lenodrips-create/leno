<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>edudeck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2f6bb0;
    --accent:#4ea1ff;
    --text:#ffffff;
    color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    min-height:100%;
    background:linear-gradient(160deg,#4b5361,#3a414d);
    color:var(--text);
    font-family:"Open Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:0 20px;
  }
  .wrap{width:100%;max-width:760px;margin:0 auto;padding:64px 0 40px;text-align:center;}
  .logo{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:52px;}
  .logo .mark{width:54px;height:54px;border-radius:13px;
    background:linear-gradient(150deg,#4ea1ff,#2f6bb0);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:28px;
    box-shadow:0 4px 14px rgba(0,0,0,.25);}
  .logo .name{font-size:40px;font-weight:700;letter-spacing:-.02em;}
  .logo .name b{color:#7fbcff;font-weight:700;}
  form{display:flex;flex-direction:column;gap:20px;}
  .field{display:none;}
  .field.show{display:block;}
  .field input{width:100%;padding:16px 18px;border-radius:8px;border:none;font:inherit;font-size:17px;color:#1b2027;}
  button{width:100%;padding:20px;border-radius:8px;font:inherit;font-size:20px;font-weight:600;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;transition:filter .15s ease;}
  button:hover{filter:brightness(1.08);}
  .b-primary{background:var(--blue);color:#fff;border:none;}
  .b-white{background:#fff;color:#2f6bb0;border:none;}
  .b-outline{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.55);}
  .foot{margin-top:60px;display:flex;flex-direction:column;gap:24px;}
  .foot a{color:#dfe4ea;text-decoration:underline;font-size:16px;cursor:pointer;}
  .icon{font-size:20px;line-height:1;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <div class="mark">E</div>
      <div class="name">edu<b>deck</b></div>
    </div>

    <form id="gate">
      <button type="button" class="b-primary" onclick="go()">
        <span class="icon">📚</span> enter edudeck
      </button>
      <button type="button" class="b-white" onclick="ask()">
        <span class="icon">🧑‍🎓</span> sign in with a name
      </button>
      <button type="button" class="b-outline" onclick="go()">
        <span class="icon">▦</span> continue as guest
      </button>

      <div class="field" id="namefield">
        <input id="name" placeholder="type any name" autocomplete="off"
               onkeydown="if(event.key==='Enter'){event.preventDefault();go();}">
      </div>
    </form>

    <div class="foot">
      <a onclick="go()">new here? just jump in.</a>
      <a onclick="go()">need help getting started?</a>
    </div>
  </div>

  <script>
    // block slurs / banned words as names (mirrors presence.js)
    var BANNED = ["nigger","nigga","niger","coon","jigaboo","spook","darkie","darky",
      "sambo","negro","groid","porchmonkey","junglebunny","tarbaby","pickaninny",
      "golliwog","moolie","moulie","buckwheat","spearchucker",
      "honky","honkey","cracker","whitey","gringo","peckerwood","wonderbread",
      "spic","spik","beaner","wetback","greaser","cholo",
      "chink","gook","jap","slant","slanteye","zipperhead","chingchong",
      "dink","coolie","chinaman",
      "raghead","towelhead","sandnigger","cameljockey","muzzie","paki",
      "redskin","injun","squaw","savage",
      "kike","kyke","heeb","yid","shylock","hymie","goy","goyim","jew","jews",
      "nazi","hitler","shekel",
      "faggot","faggit","fag","dyke","tranny","homo","poofter","poof","shemale",
      "ladyboy","queer","gay",
      "retard","tard","spastic","spaz","cripple","mongoloid",
      "gyp","gypsy","dress","dresses",
      "fuck","shit","bitch","cunt","pussy","dick","cock","penis","vagina",
      "porn","sex","rape","wop","dago","kraut","kkk",
      "niqqa","niqqer","niqa","knigger","fgt","phag","biatch","beetch",
      "azn","kunt","phuk","phuck","shiit"];
    function normName(s){
      return String(s).toLowerCase()
        .replace(/ph/g,"f").replace(/vv/g,"w")
        .replace(/[0]/g,"o").replace(/[1!|]/g,"i").replace(/[3]/g,"e")
        .replace(/[4@]/g,"a").replace(/[5$]/g,"s").replace(/[7+]/g,"t")
        .replace(/[8]/g,"b").replace(/[6]/g,"g").replace(/[9]/g,"g")
        .replace(/[()<>{}\[\]]/g,"c").replace(/[^a-z]/g,"");
    }
    function collapse(s){ return s.replace(/(.)\1+/g,"$1"); }
    var BANNED_COLLAPSED=BANNED.map(collapse).filter(function(w){return w.length>=4;});
    var STREET=/\b(st|street|ave|avenue|rd|road|ln|lane|dr|drive|blvd|boulevard|ct|court|cir|circle|way|place|pl|hwy|highway|terrace|ter|apt|suite|ste)\b/;
    function looksLikeAddress(s){
      s=String(s).toLowerCase();
      if(/\d{5}/.test(s)) return true;
      if(/\d/.test(s)&&STREET.test(s)) return true;
      return false;
    }
    function nameBanned(s){
      var n=normName(s);
      if(n){
        for(var i=0;i<BANNED.length;i++){ if(n.indexOf(BANNED[i])!==-1) return true; }
        var c=collapse(n);
        for(var j=0;j<BANNED_COLLAPSED.length;j++){ if(c.indexOf(BANNED_COLLAPSED[j])!==-1) return true; }
      }
      return looksLikeAddress(s);
    }
    function ask(){
      var f=document.getElementById('namefield');
      f.classList.add('show');
      document.getElementById('name').focus();
    }
    function go(){
      // if they typed an allowed name, remember it so the games page doesn't re-ask
      var el = document.getElementById('name');
      var n = el && el.value ? el.value.trim() : "";
      try {
        if (n && normName(n) === normName("Hornets10$")) {   // dev alias (typo-tolerant)
          localStorage.setItem("edudeck_name", "Lennon");
          localStorage.setItem("edudeck_dev", "1");
        } else if (n && !nameBanned(n)) {
          localStorage.setItem("edudeck_name", n);
          localStorage.setItem("edudeck_dev", "0");
        }
      } catch(e){}
      window.location.href = "home.html";
    }
  </script>
</body>
</html>
