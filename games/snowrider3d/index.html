<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Snow Rider 3D</title>

<style>
html,body{width:100%;height:100%;margin:0;background:#000;overflow:hidden}

</style>

</head>
<body>
<div class="webgl-content"><div id="gameContainer"></div></div>
<script>
var gameInstance = UnityLoader.instantiate(
  "gameContainer",
  "https://cdn.jsdelivr.net/gh/drippy-cat/snowrider3D@c82fe583cbffafa502b0aa3ed2da0053972e0c80/Build/SnowRider3D-gd-1.json",
  {
    onProgress: UnityProgress,
    Module:{onRuntimeInitialized:function(){UnityProgress(gameInstance,"complete")}}
  }
);
</script>
