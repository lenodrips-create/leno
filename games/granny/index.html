<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Granny</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
#unity-canvas{position:absolute;inset:0;width:100%;height:100%;background:#000}
#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px,80vw);text-align:center}
#loading img{width:200px;max-width:60vw;margin-bottom:18px}
#bar{height:14px;border:2px solid #fff;border-radius:8px;overflow:hidden}
#fill{height:100%;width:0;background:#4caf50;transition:width .3s}
#err{color:#f66;font:14px sans-serif;margin-top:12px}
</style>
<script>
// Stand-in for the Yandex Games SDK the build calls; resolves without ads.
window.YaGames = { init: function () {
  var noop = function () {};
  var skip = function (o) { var c = (o && o.callbacks) || {}; (c.onClose || noop)(false); };
  return Promise.resolve({
    deviceInfo: { type: "desktop" },
    adv: { showFullscreenAdv: skip, showRewardedVideo: skip, showBannerAdv: noop, hideBannerAdv: noop },
    features: { LoadingAPI: { ready: noop }, GameplayAPI: { start: noop, stop: noop } }
  });
} };
</script>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loading"><img src="logo.png" alt=""><div id="bar"><div id="fill"></div></div><div id="err"></div></div>
<script>
var myGameInstance = null;
var fill = document.getElementById("fill");
async function joined(name, parts, from, span) {
  var bufs = [];
  for (var i = 1; i <= parts; i++) {
    var r = await fetch("Build/Granny_part" + i + "." + name);
    if (!r.ok) throw new Error("missing Build/Granny_part" + i + "." + name);
    bufs.push(await r.arrayBuffer());
    fill.style.width = (from + span * i / parts) + "%";
  }
  return URL.createObjectURL(new Blob(bufs, { type: "application/octet-stream" }));
}
(async function () {
  try {
    var data = await joined("data", 2, 0, 35);
    var wasm = await joined("wasm", 2, 35, 35);
    var s = document.createElement("script");
    s.src = "Build/Granny.loader.js";
    s.onload = function () {
      createUnityInstance(document.getElementById("unity-canvas"), {
        dataUrl: data, frameworkUrl: "Build/Granny.framework.js", codeUrl: wasm,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Anastasia Kazantseva", productName: "Granny", productVersion: "1.0"
      }, function (p) { fill.style.width = (70 + 30 * p) + "%"; })
      .then(function (inst) { myGameInstance = inst; document.getElementById("loading").remove(); })
      .catch(function (e) { document.getElementById("err").textContent = e; });
    };
    document.body.appendChild(s);
  } catch (e) { document.getElementById("err").textContent = e.message; }
})();
</script>
</body>
</html>
