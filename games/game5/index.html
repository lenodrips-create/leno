<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Minecraft</title>
  <style>
    html,body{margin:0;min-height:100%;background:#111;color:#fff;font-family:Arial,sans-serif}
    body{display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
    .wrap{width:min(100%,960px);text-align:center}
    .banner{display:block;width:100%;height:auto;aspect-ratio:480/100;object-fit:fill;border:3px solid #222;box-sizing:border-box}
    h1{margin:22px 0 14px;font-size:32px}
    .play{display:inline-block;text-decoration:none;color:#111;background:#fff;padding:12px 20px;border-radius:10px;font-weight:700}
    .play img{display:block;width:180px;height:135px;object-fit:contain;margin:0 auto 8px}
    .play span{display:block;line-height:1.35}
  </style>
</head>
<body>
  <main class="wrap">
    <img class="banner" src="banner.svg" alt="Minecraft banner">
    <h1>minecraft</h1>
    <a target="_blank" rel="noopener noreferrer" href="https://www.y8.com/games/parkour_world" class="play">
      <img alt="Parkour World" class="thumb playable" src="https://cdn2.y8.com/cloudimage/264063/file/w180h135_webp-41174fa0204bb7b85b296e93e0a81c63.webp">
      <span>Parkour World</span>
      <span>Play Now!</span>
    </a>
  </main>
</body>
</html>
