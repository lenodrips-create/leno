<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baldis Basic</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/baldis-basics/TemplateData/style.css">
<style>
html,body{width:100%;height:100%;margin:0;background:#000;overflow:hidden}
.webgl-content,#unityContainer,#gameContainer{width:100%!important;height:100%!important;margin:0!important;padding:0!important}
</style>
<script>
window.fileMergerConfig={
  files:[
    {name:"baldi.data.unityweb",parts:2},
    {name:"baldi.wasm.code.unityweb",parts:1},
    {name:"baldi.wasm.framework.unityweb",parts:1}
  ],
  basePath:"https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/baldis-basics/unity/",
  debug:false
};
</script>
<script src="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/merge.js"></script>
<script src="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/baldis-basics/TemplateData/UnityProgress.js"></script>
<script src="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/baldis-basics/baldi.js"></script>
</head>
<body>
<div class="webgl-content">
  <div id="unityContainer">
    <div id="gameContainer"></div>
  </div>
</div>
<script>
var gameInstance=UnityLoader.instantiate(
  "gameContainer",
  "https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/baldis-basics/baldi.json",
  {onProgress:UnityProgress,Module:{onRuntimeInitialized:function(){UnityProgress(gameInstance,"complete")}}}
);
</script>
</body>
</html>
