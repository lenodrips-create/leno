name: Import Aquapark.io game files

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, 'Import Aquapark.io game files') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Aquapark.io build files
        run: |
          set -e
          rm -rf games/aquapark-io
          mkdir -p games/aquapark-io/Build
          base='https://sourceforge.net/projects/nexusapp/files'
          curl -fL "$base/WaterParkSlides3Dx2.data.unityweb/download" -o games/aquapark-io/Build/WaterParkSlides3Dx2.data.unityweb
          curl -fL "$base/WaterParkSlides3Dx2.wasm.code.unityweb/download" -o games/aquapark-io/Build/WaterParkSlides3Dx2.wasm.code.unityweb
          curl -fL "$base/WaterParkSlides3Dx2.wasm.framework.unityweb/download" -o games/aquapark-io/Build/WaterParkSlides3Dx2.wasm.framework.unityweb
          curl -fL "$base/WaterParkSlides3Dx2.json/download" -o games/aquapark-io/Build/WaterParkSlides3Dx2.json
          curl -fL "$base/UnityLoader.js/download" -o games/aquapark-io/Build/UnityLoader.js

      - name: Create local game page
        run: |
          cat > games/aquapark-io/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>aquapark.io</title>
            <style>
              html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
              #gameContainer{width:100vw;height:100vh}
            </style>
            <script src="Build/UnityLoader.js"></script>
          </head>
          <body>
            <div id="gameContainer"></div>
            <script>
              var gameInstance = UnityLoader.instantiate("gameContainer", "Build/WaterParkSlides3Dx2.json", { onProgress: function(){} });
            </script>
          </body>
          </html>
          HTML

      - name: Commit local game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A games/aquapark-io
          git commit -m "Import Aquapark.io game files"
          git push