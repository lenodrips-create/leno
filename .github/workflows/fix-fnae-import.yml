name: Fix Five Nights at Einsteins import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-fnae-import.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace submodule with real game files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf games/game5

          rm -rf /tmp/fnae
          git clone --depth 1 https://github.com/n1yshi/Five-Nights-at-Epstein.git /tmp/fnae

          mkdir -p games/game5
          rsync -a --exclude='.git' /tmp/fnae/ games/game5/
          rm -f games/game5/CNAME

          # Randomly selected gameplay screenshot used as the banner.
          cp games/game5/assets/images/Cam8.png games/game5/banner.png

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A games/game5
          git commit -m "Store Five Nights at Einsteins as real game files"
          git push

          rm -f .github/workflows/fix-fnae-import.yml
          git add .github/workflows/fix-fnae-import.yml
          git commit -m "Remove temporary Five Nights at Einsteins fix workflow"
          git push
